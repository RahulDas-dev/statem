[package]
name = "statem-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "A minimal async state machine engine for Rust -- a sibling of the Python `statem` package."
license = "MIT"
authors = ["RahulDas-dev <r.das699@gmail.com>"]
repository = "https://github.com/RahulDas-dev/statem"
keywords = ["state-machine", "fsm", "async", "workflow"]
categories = ["asynchronous", "data-structures"]

[dependencies]
async-trait = "0.1"
indexmap = { version = "=2.13.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-stream = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", features = ["async-await", "std"], optional = true }
json-patch = { version = "4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
agui = ["dep:async-stream", "dep:futures-channel", "dep:futures-util", "dep:json-patch"]
