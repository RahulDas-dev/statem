[project]
name = "statem"
version = "0.1.0"
description = "A lightweight state machine library built on Pydantic"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RahulDas-dev", email = "r.das699@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/RahulDas-dev/statem"
Repository = "https://github.com/RahulDas-dev/statem"
Documentation = "https://rahuldas-dev.github.io/statem/"

[tool.uv]
dev-dependencies = [
    "ruff>=0.16.1",
    "coverage>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statem"]

[tool.ruff]
exclude = [
    ".ruff_cache",
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
]
extend-include = []
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
ignore = ["ANN204", "ANN401", "E731", "D", "DTZ005", "BLE001","B008", "CPY001","COM812","E501", "ERA001", "EM101","EM102", "FA","FBT", "G004", "UP", "TRY", "PTH123","ISC001", "T201","PD015" ]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001", "PLR2004", "ANN", "ARG001", "PT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.coverage.run]
source = ["statem"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]